<!doctype html>
<!--
  Offline shot renderer (never shipped). Loads the scene's depth layers
  (scripts/plates/layers.py, tier "o"), pushes each one out to its real distance
  as a mesh (camera projection: from the photo's own viewpoint it is the photo
  again; from anywhere else it has true parallax) and renders stills for the
  site from a list of cameras. Driven by scripts/render/render.mjs.
-->
<meta charset="utf-8" />
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
const F = 3268            // photo focal length in scene px (50 degree vertical field)
const CX = 4000, CY = 1524 // principal point in scene px

const VS = `#version 300 es
precision highp float;
in vec2 aUv;                       // 0..1 across the layer's box
uniform sampler2D uDepth;          // packed log depth, one layer per channel
uniform int uCh;
uniform vec4 uBox;                 // layer box in scene px: x, y, w, h
uniform vec2 uScene;
uniform vec2 uZ;                   // log zmin, log zmax
uniform mat4 uView, uProj;
uniform float uFlat;               // > 0: a flat plane at this distance (multiplane)
out vec2 vUv;
out float vDist;
void main() {
  vec2 sp = uBox.xy + aUv * uBox.zw;              // scene px
  vec4 d4 = texture(uDepth, sp / uScene);
  float d = uCh == 0 ? d4.r : uCh == 1 ? d4.g : uCh == 2 ? d4.b : d4.a;
  float z = uFlat > 0.0 ? uFlat : exp(mix(uZ.x, uZ.y, d));
  vec3 p = vec3((sp.x - ${CX.toFixed(1)}) / ${F.toFixed(1)}, -(sp.y - ${CY.toFixed(1)}) / ${F.toFixed(1)}, 1.0) * z;
  vec4 v = uView * vec4(p, 1.0);
  vDist = -v.z;
  gl_Position = uProj * v;
  vUv = aUv;
}`
const FS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform float uAlpha;
in vec2 vUv;
in float vDist;
out vec4 o;
void main() {
  vec4 c = texture(uTex, vUv);
  if (vDist < 0.5) discard;
  o = vec4(c.rgb * c.a, c.a) * uAlpha;            // premultiplied
}`

const canvas = document.getElementById('c')
const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true })
const aniso = gl.getExtension('EXT_texture_filter_anisotropic')

function compile(vs, fs) {
  const p = gl.createProgram()
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t)
    gl.shaderSource(sh, s)
    gl.compileShader(sh)
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh))
    gl.attachShader(p, sh)
  }
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
  const u = {}
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const n = gl.getActiveUniform(p, i).name
    u[n] = gl.getUniformLocation(p, n)
  }
  return { p, u }
}
const prog = compile(VS, FS)
const QVS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec2 aUv;
uniform mat4 uView, uProj;
uniform vec4 uUvRect;              // uv offset/scale (tiling a texture over a quad)
out vec2 vUv;
out vec2 vQuv;
out float vDist;
void main() {
  vQuv = aUv;
  vec4 v = uView * vec4(aPos, 1.0);
  vDist = -v.z;
  gl_Position = uProj * v;
  vUv = uUvRect.xy + aUv * uUvRect.zw;
}`
const QFS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform float uAlpha;
uniform vec4 uFog;                 // rgb, amount: blend toward this colour
uniform float uEdge;               // > 0: fade alpha toward the quad's edges (uv 0..1 of the quad)
in vec2 vUv;
in vec2 vQuv;
in float vDist;
out vec4 o;
void main() {
  vec4 c = texture(uTex, vUv);
  if (vDist < 0.02) discard;
  c.rgb = mix(c.rgb, uFog.rgb, uFog.a);
  if (uEdge > 0.0) {
    float e = min(min(vQuv.x, 1.0 - vQuv.x), min(vQuv.y, 1.0 - vQuv.y));
    c.a *= smoothstep(0.0, uEdge, e);
  }
  o = vec4(c.rgb * c.a, c.a) * uAlpha;
}`
const qprog = compile(QVS, QFS)

const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src })
function texture(img, mip = true) {
  const t = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, t)
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img)
  if (mip) gl.generateMipmap(gl.TEXTURE_2D)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  if (aniso && mip) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 16)
  return t
}
function grid(cols, rows) {
  const v = new Float32Array((cols + 1) * (rows + 1) * 2)
  let k = 0
  for (let y = 0; y <= rows; y++) for (let x = 0; x <= cols; x++) { v[k++] = x / cols; v[k++] = y / rows }
  const idx = new Uint32Array(cols * rows * 6)
  k = 0
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const a = y * (cols + 1) + x, b = a + 1, c = a + cols + 1, d = c + 1
    idx.set([a, c, b, b, c, d], k); k += 6
  }
  const vao = gl.createVertexArray()
  gl.bindVertexArray(vao)
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW)
  return { vao, count: idx.length }
}
gl.bindAttribLocation(prog.p, 0, 'aUv')
gl.linkProgram(prog.p)
for (let i = 0; i < gl.getProgramParameter(prog.p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(prog.p, i).name; prog.u[n] = gl.getUniformLocation(prog.p, n) }

// ---- camera: position, yaw (right +), pitch (up +), vertical fov, lens shift
function look(pos, yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch)
  const f = [sy * cp, sp, cy * cp]                       // forward
  const r = [cy, 0, -sy]                                 // right
  const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]]  // up = forward x right
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
  // view looks down -z
  return new Float32Array([r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, pos), -dot(u, pos), dot(f, pos), 1])
}
function proj(vfov, aspect, shiftX, shiftY, near = 0.5, far = 60000) {
  const t = 1 / Math.tan(vfov / 2)
  return new Float32Array([t / aspect, 0, 0, 0, 0, t, 0, 0, shiftX, shiftY, -(far + near) / (far - near), -1, 0, 0, (-2 * far * near) / (far - near), 0])
}

let planes = null
window.initPlanes = async (base) => {
  const meta = await (await fetch(base + 'planes.json')).json()
  const quad = grid(1, 1)
  const list = []
  for (const p of meta.planes) list.push({ ...p, tex: texture(await load(base + p.file)) })
  const dummy = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, dummy)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4))
  planes = { meta, list, quad, dummy }
  return list.length
}

let scene = null
window.init = async (base) => {
  const meta = await (await fetch(base + 'layers-o.json')).json()
  const depthImg = await load(base + 'layer-o-depth.png')
  const depth = texture(depthImg, false)
  const layers = []
  for (const [ch, name] of ['sky', 'far', 'mid', 'fg'].entries()) {
    const img = await load(base + `layer-o-${name}.png`)
    const box = meta.layers[name].box
    layers.push({ name, ch, box, tex: texture(img), mesh: grid(Math.max(8, Math.round(box[2] / 6)), Math.max(8, Math.round(box[3] / 6))) })
  }
  scene = { meta, depth, layers }
  return true
}

// shot: { w, h, pos:[x,y,z], yaw, pitch, vfov (deg), shift:[x,y], alpha: {layer: a} }
const texCache = {}
async function getTex(base, file, repeat) {
  if (!texCache[file]) {
    const t = texture(await load(base + file))
    if (repeat) {
      gl.bindTexture(gl.TEXTURE_2D, t)
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT)
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT)
    }
    texCache[file] = t
  }
  return texCache[file]
}
function quadMesh(c) {
  // c: four corners tl, tr, br, bl in world space
  const v = new Float32Array([...c[0], 0, 0, ...c[1], 1, 0, ...c[2], 1, 1, ...c[3], 0, 1])
  const vao = gl.createVertexArray()
  gl.bindVertexArray(vao)
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0)
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12)
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array([0, 3, 1, 1, 3, 2]), gl.STATIC_DRAW)
  return { vao, b, ib }
}
const planePoint = (P, sx, sy) => [((sx - CX) / F) * P.z, (-(sy - CY) / F) * P.z, P.z]

window.shotPlanes = async (s) => {
  for (const q of s.quads || []) q._tex = await getTex('/assets/', q.tex, q.repeat)
  canvas.width = s.w
  canvas.height = s.h
  gl.viewport(0, 0, s.w, s.h)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA)
  gl.useProgram(prog.p)
  gl.uniformMatrix4fv(prog.u.uView, false, look(s.pos, s.yaw, s.pitch))
  gl.uniformMatrix4fv(prog.u.uProj, false, proj((s.vfov * Math.PI) / 180, s.w / s.h, s.shift[0], s.shift[1]))
  gl.uniform2f(prog.u.uScene, planes.meta.scene[0], planes.meta.scene[1])
  gl.uniform2f(prog.u.uZ, 0, 1)
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, planes.dummy); gl.uniform1i(prog.u.uDepth, 1)
  gl.uniform1i(prog.u.uTex, 0)
  gl.uniform1i(prog.u.uCh, 0)
  // everything, far to near by distance along the view
  const fwd = [Math.sin(s.yaw) * Math.cos(s.pitch), Math.sin(s.pitch), Math.cos(s.yaw) * Math.cos(s.pitch)]
  const along = (p) => (p[0] - s.pos[0]) * fwd[0] + (p[1] - s.pos[1]) * fwd[1] + (p[2] - s.pos[2]) * fwd[2]
  const items = []
  for (const P of planes.list) {
    const a = s.alpha?.[P.name] ?? 1
    if (a > 0) items.push({ kind: 'plane', P, a, key: s.order?.[P.name] ?? along(planePoint(P, 4000, 1524)) })
  }
  for (const q of s.quads || []) {
    const c = q.corners
    const mid = [0, 1, 2].map((k) => (c[0][k] + c[1][k] + c[2][k] + c[3][k]) / 4)
    items.push({ kind: 'quad', q, key: q.order ?? along(mid) })
  }
  items.sort((x, y) => y.key - x.key)
  const view = look(s.pos, s.yaw, s.pitch)
  const pr = proj((s.vfov * Math.PI) / 180, s.w / s.h, s.shift[0], s.shift[1], s.near ?? 0.5)
  for (const it of items) {
    gl.activeTexture(gl.TEXTURE0)
    if (it.kind === 'plane') {
      gl.useProgram(prog.p)
      gl.uniformMatrix4fv(prog.u.uView, false, view)
      gl.uniformMatrix4fv(prog.u.uProj, false, pr)
      gl.bindTexture(gl.TEXTURE_2D, it.P.tex)
      gl.uniform4f(prog.u.uBox, ...it.P.box)
      gl.uniform1f(prog.u.uFlat, it.P.z)
      gl.uniform1f(prog.u.uAlpha, it.a)
      gl.bindVertexArray(planes.quad.vao)
      gl.drawElements(gl.TRIANGLES, planes.quad.count, gl.UNSIGNED_INT, 0)
    } else {
      const q = it.q
      gl.useProgram(qprog.p)
      gl.uniformMatrix4fv(qprog.u.uView, false, view)
      gl.uniformMatrix4fv(qprog.u.uProj, false, pr)
      gl.bindTexture(gl.TEXTURE_2D, q._tex)
      gl.uniform1i(qprog.u.uTex, 0)
      gl.uniform4f(qprog.u.uUvRect, ...(q.uv || [0, 0, 1, 1]))
      gl.uniform1f(qprog.u.uAlpha, q.alpha ?? 1)
      gl.uniform4f(qprog.u.uFog, ...(q.fog || [1, 1, 1, 0]))
      gl.uniform1f(qprog.u.uEdge, q.edge ?? 0)
      const m = quadMesh(q.corners)
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_INT, 0)
      gl.deleteBuffer(m.b); gl.deleteBuffer(m.ib); gl.deleteVertexArray(m.vao)
    }
  }
  gl.finish()
  return canvas.toDataURL('image/png')
}

window.shot = (s) => {
  canvas.width = s.w
  canvas.height = s.h
  gl.viewport(0, 0, s.w, s.h)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA)
  gl.useProgram(prog.p)
  const { meta } = scene
  gl.uniformMatrix4fv(prog.u.uView, false, look(s.pos, s.yaw, s.pitch))
  gl.uniformMatrix4fv(prog.u.uProj, false, proj((s.vfov * Math.PI) / 180, s.w / s.h, s.shift[0], s.shift[1]))
  gl.uniform2f(prog.u.uScene, meta.scene[0], meta.scene[1])
  gl.uniform2f(prog.u.uZ, Math.log(meta.depth.zmin), Math.log(meta.depth.zmax))
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, scene.depth); gl.uniform1i(prog.u.uDepth, 1)
  gl.uniform1i(prog.u.uTex, 0)
  for (const L of scene.layers) {
    const a = s.alpha?.[L.name] ?? 1
    if (a <= 0) continue
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex)
    gl.uniform1i(prog.u.uCh, L.ch)
    gl.uniform4f(prog.u.uBox, ...L.box)
    gl.uniform1f(prog.u.uAlpha, a)
    gl.bindVertexArray(L.mesh.vao)
    gl.drawElements(gl.TRIANGLES, L.mesh.count, gl.UNSIGNED_INT, 0)
  }
  gl.finish()
  return canvas.toDataURL('image/png')
}
window.ready = true
</script>
</body>
